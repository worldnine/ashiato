[package]
name = "revpick"
version = "0.1.0"
edition = "2024"
description = "Flat mtime-sorted file picker TUI: pick recent files, hand them to mdcomment."
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = "0.4"
ignore = "0.4"
ratatui = "0.30"
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
